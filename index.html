<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITMLABS</title>
    <!-- Favicon из images/favicon/ -->
    <link rel="icon" type="image/svg+xml" href="./images/favicon/favicon-0.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #000; color: #fff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex; flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            pointer-events: none; z-index: 0;
        }
        .decor-left, .decor-right {
            position: fixed; top: 0;
            width: 1px; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
            z-index: 0;
        }
        .decor-left { left: 15%; } .decor-right { right: 15%; }
        .decor-top, .decor-bottom {
            position: fixed; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            z-index: 0;
        }
        .decor-top { top: 12%; } .decor-bottom { bottom: 12%; }

        .container {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            flex: 1; padding: 40px 20px;
        }
        .logo { text-align: center; margin-bottom: 60px; }
        .logo h1 {
            font-size: 4rem; font-weight: 200;
            letter-spacing: 0.3em; text-transform: uppercase;
        }
        .logo h1 strong {
            font-weight: 700;
            background: linear-gradient(180deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-line {
            width: 80px; height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            margin: 16px auto 0;
        }
        .menu {
            display: flex; flex-direction: column;
            gap: 4px; width: 420px; max-width: 90vw;
        }
        .menu-item {
            display: flex; align-items: center; gap: 20px;
            text-decoration: none;
            color: rgba(255,255,255,0.55);
            padding: 16px 24px;
            border: 1px solid transparent;
            border-radius: 8px;
            transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .menu-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 0 40px rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }
        .menu-item:hover .menu-arrow { opacity: 1; transform: translateX(0); }
        .menu-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; color: #fff;
            opacity: 0.35; width: 32px; text-align: right;
            transition: opacity 0.3s;
        }
        .menu-item:hover .menu-num { opacity: 0.8; }
        .menu-icon {
            width: 28px; height: 28px;
            flex-shrink: 0;
        }
        .menu-icon img {
            width: 100%; height: 100%;
            opacity: 0.7; transition: opacity 0.3s;
        }
        .menu-item:hover .menu-icon img { opacity: 1; }
        .menu-label {
            font-size: 1.1rem; font-weight: 500;
            letter-spacing: 0.04em; flex: 1;
        }
        .menu-arrow {
            opacity: 0; transform: translateX(-8px);
            transition: all 0.3s; color: #fff; font-size: 1rem;
        }
        /* Футер */
        .footer {
            position: relative; z-index: 1;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding: 24px 20px; margin-top: auto;
        }
        .footer-inner {
            max-width: 1100px; margin: 0 auto;
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 16px;
        }
        .footer-links { display: flex; gap: 16px; align-items: center; }
        .footer-link {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 6px;
            background: rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .footer-link:hover { background: rgba(255,255,255,0.15); }
        .footer-icon {
            width: 18px; height: 18px;
            opacity: 0.7; transition: opacity 0.2s;
        }
        .footer-link:hover .footer-icon { opacity: 1; }
        .footer-right { text-align: right; }
        .footer-copy {
            font-size: 0.75rem; color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }
        .footer-version {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; color: rgba(255,255,255,0.3);
        }

        @media (max-width: 500px) {
            .logo h1 { font-size: 2.4rem; letter-spacing: 0.2em; }
            .menu { width: 100%; }
            .menu-item { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <div class="decor-left"></div>
    <div class="decor-right"></div>
    <div class="decor-top"></div>
    <div class="decor-bottom"></div>

    <div class="container">
        <div class="logo">
            <h1>ITM|<strong>LABS</strong></h1>
            <div class="logo-line"></div>
        </div>
        <nav class="menu">
            <a href="./lab/" class="menu-item">
                <span class="menu-num">01</span>
                <div class="menu-icon"><img src="./images/icon-1.svg" alt="Лаборатория"></div>
                <span class="menu-label">Лаборатория</span>
                <span class="menu-arrow">→</span>
            </a>
            <a href="./science/" class="menu-item">
                <span class="menu-num">02</span>
                <div class="menu-icon"><img src="./images/icon-2.svg" alt="Наука"></div>
                <span class="menu-label">Наука</span>
                <span class="menu-arrow">→</span>
            </a>
            <a href="./dnd/" class="menu-item">
                <span class="menu-num">03</span>
                <div class="menu-icon"><img src="./images/icon-3.svg" alt="D&amp;D"></div>
                <span class="menu-label">D&amp;D</span>
                <span class="menu-arrow">→</span>
            </a>
            <a href="./ai-experiments/" class="menu-item">
                <span class="menu-num">04</span>
                <div class="menu-icon"><img src="./images/icon-4.svg" alt="AI"></div>
                <span class="menu-label">AI</span>
                <span class="menu-arrow">→</span>
            </a>
            <a href="./cyss/" class="menu-item">
                <span class="menu-num">05</span>
                <div class="menu-icon"><img src="./images/icon-5.svg" alt="СОМУ"></div>
                <span class="menu-label">СОМУ</span>
                <span class="menu-arrow">→</span>
            </a>
        </nav>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-left">
                <div class="footer-links">
                    <a href="https://vk.ru/sainon_dar" class="footer-link" title="ВКонтакте" target="_blank">
                        <img src="./images/main/social-vk.svg" alt="VK" class="footer-icon">
                    </a>
                    <a href="https://t.me/itmorev" class="footer-link" title="Telegram" target="_blank">
                        <img src="./images/main/social-tg.svg" alt="Telegram" class="footer-icon">
                    </a>
                    <a href="https://max.ru/u/f9LHodD0cOLHGSpT9D-UhKI1a0LU_8SXZgxC98z79Oo5oQq9khXa7w2wZSo" class="footer-link" title="Max" target="_blank">
                        <img src="./images/main/social-max.svg" alt="Max" class="footer-icon">
                    </a>
                    <a href="mailto:iizegrimm@yandex.ru" class="footer-link" title="Email">
                        <img src="./images/main/social-email.svg" alt="Email" class="footer-icon">
                    </a>
                </div>
            </div>
            <div class="footer-right">
                <p class="footer-copy">&copy; 2026 itmlabs &middot; Все права защищены</p>
                <p class="footer-version">v 0.2</p>
            </div>
        </div>
    </footer>
</body>
</html>
