<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЦК Алмазова · Анализ и айдентика</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#f5f5f7;
  color:#1E3A5F;
  font-family:'Inter',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
}
.sidebar {
  width:220px;
  background:#fff;
  border-right:1px solid #e0e0e0;
  padding:24px 16px 16px;
  display:flex;
  flex-direction:column;
  gap:2px;
  flex-shrink:0;
  overflow-y:auto;
  transition: display 0.2s;
}
.sidebar.hidden { display:none; }
.sidebar .section-title {
  font-size:0.65rem;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:#999;
  padding:12px 14px 4px 14px;
  cursor:default;
  user-select:none;
}
.sidebar .menu-item {
  background:transparent;
  border:none;
  color:#666;
  padding:8px 14px 8px 20px;
  border-radius:6px;
  text-align:left;
  font-size:0.8rem;
  cursor:pointer;
  transition:all 0.2s;
  font-family:inherit;
}
.sidebar .menu-item:hover {
  background:#f0f4f8;
  color:#1E3A5F;
}
.sidebar .menu-item.active {
  background:#e6f0fa;
  color:#1E3A5F;
  font-weight:500;
  border-left:3px solid #2D9CDB;
}
.main {
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  background:#fff;
}
.slide-wrapper {
  flex:1;
  overflow-y:auto;
  padding:40px 50px;
}
.slide { display:none; }
.slide.active { display:block; }
.back-btn {
  position:absolute;
  top:16px;
  left:16px;
  background:#f0f4f8;
  border:1px solid #e0e0e0;
  color:#666;
  padding:4px 14px;
  border-radius:20px;
  font-size:0.7rem;
  cursor:pointer;
  display:none;
  font-family:inherit;
  transition:0.2s;
  z-index:5;
}
.back-btn.visible { display:block; }
.back-btn:hover { background:#e0e8f0; color:#1E3A5F; }
.page-number {
  position:absolute;
  bottom:16px;
  right:24px;
  font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;
  color:#bbb;
}
.page-number.hidden { display:none; }
.footer {
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  font-size:0.65rem;
  color:#ccc;
  font-weight:300;
  letter-spacing:0.02em;
  white-space:nowrap;
}
.slide-title {
  font-size:1.8rem;
  font-weight:600;
  color:#1E3A5F;
  margin-bottom:2px;
}
.slide-subtitle {
  font-size:0.8rem;
  color:#888;
  border-bottom:1px solid #eee;
  padding-bottom:10px;
  margin-bottom:16px;
}
.accent-line {
  width:50px;
  height:3px;
  background:#2D9CDB;
  border-radius:2px;
  margin:6px 0 14px;
}
.grid-2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.card {
  background:#fafafa;
  border:1px solid #eee;
  border-radius:12px;
  padding:14px 16px;
  transition:0.2s;
}
.card:hover {
  border-color:#2D9CDB;
  box-shadow:0 4px 12px rgba(45,156,219,0.06);
}
.card .name {
  font-weight:600;
  color:#1E3A5F;
  margin-bottom:2px;
}
.card .uni {
  font-size:0.7rem;
  color:#999;
}
.card .feature {
  font-size:0.78rem;
  color:#555;
  margin-top:4px;
}
.card a {
  color:#2D9CDB;
  font-size:0.7rem;
  text-decoration:none;
  border-bottom:1px solid rgba(45,156,219,0.2);
}
.matrix-table {
  width:100%;
  border-collapse:collapse;
  font-size:0.7rem;
}
.matrix-table th {
  color:#999;
  font-weight:500;
  text-align:left;
  padding:4px 6px;
  border-bottom:1px solid #eee;
}
.matrix-table td {
  padding:4px 6px;
  border-bottom:1px solid #f5f5f5;
  color:#555;
}
.matrix-table td:first-child {
  color:#1E3A5F;
  font-weight:500;
}
.highlight-box {
  background:#f5faff;
  border-left:3px solid #2D9CDB;
  padding:10px 14px;
  border-radius:6px;
  margin-bottom:8px;
}
.highlight-box p {
  font-size:0.8rem;
  color:#333;
}
.highlight-box strong {
  color:#1E3A5F;
}
.concept-grid {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
  margin-top:8px;
}
.concept-card {
  background:#fafafa;
  border:1px solid #eee;
  border-radius:12px;
  padding:16px;
  text-align:center;
}
.concept-card .emoji { font-size:2rem; margin-bottom:6px; }
.concept-card h4 { font-weight:600; color:#1E3A5F; font-size:0.95rem; }
.concept-card p { font-size:0.75rem; color:#666; margin-top:4px; }
.menu-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  max-width:700px;
  margin:20px auto 0;
  width:100%;
}
.menu-col h2 {
  font-size:1.1rem;
  font-weight:600;
  color:#1E3A5F;
  margin-bottom:12px;
  border-bottom:2px solid #eee;
  padding-bottom:6px;
}
.menu-col .menu-btn {
  display:block;
  width:100%;
  background:#fafafa;
  border:1px solid #eee;
  border-radius:10px;
  padding:12px 16px;
  margin-bottom:8px;
  text-align:left;
  font-size:0.85rem;
  color:#333;
  cursor:pointer;
  transition:all 0.2s;
  font-family:inherit;
}
.menu-col .menu-btn:hover {
  background:#f0f4f8;
  border-color:#2D9CDB;
  transform:translateX(4px);
}
.menu-col .menu-btn .sub {
  font-size:0.7rem;
  color:#999;
  display:block;
  margin-top:2px;
}
.uni-grid {
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.uni-grid .uni-btn {
  background:#fafafa;
  border:1px solid #eee;
  border-radius:10px;
  padding:12px 8px;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
  font-family:inherit;
  font-size:0.75rem;
  color:#333;
}
.uni-grid .uni-btn:hover {
  background:#f0f4f8;
  border-color:#2D9CDB;
  transform:translateY(-2px);
}
.uni-grid .uni-btn .short { font-size:0.6rem; color:#999; display:block; margin-top:2px; }
.analysis-block {
  margin-bottom:20px;
}
.analysis-block h3 {
  font-size:1.1rem;
  font-weight:600;
  color:#1E3A5F;
  margin:16px 0 8px;
  border-bottom:1px solid #eee;
  padding-bottom:4px;
}
.analysis-block p, .analysis-block li {
  font-size:0.85rem;
  color:#444;
  line-height:1.6;
}
.analysis-block ul {
  list-style:none;
  padding-left:0;
}
.analysis-block ul li::before {
  content:"• ";
  color:#2D9CDB;
  font-weight:bold;
}
.analysis-block img {
  max-width:100%;
  border-radius:8px;
  margin:8px 0;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
@media (max-width:700px) {
  .sidebar { width:160px; padding:12px; }
  .slide-wrapper { padding:20px; }
  .grid-2, .concept-grid, .menu-grid, .uni-grid { grid-template-columns:1fr; }
  .menu-grid { gap:16px; }
  .footer { font-size:0.55rem; }
}
</style>
</head>
<body>

<div class="sidebar hidden" id="sidebar">
  <div class="section-title">Российские вузы</div>
  <button class="menu-item active" data-target="3">Герцена</button>
  <button class="menu-item" data-target="4">РУДН</button>
  <button class="menu-item" data-target="5">ТГАСУ</button>
  <button class="menu-item" data-target="6">БГТУ Шухова</button>
  <button class="menu-item" data-target="7">МГУ</button>
  <button class="menu-item" data-target="8">ВШЭ</button>
  <button class="menu-item" data-target="9">ИТМО</button>
  <button class="menu-item" data-target="10">Сеченовский</button>
  <button class="menu-item" data-target="11">РНИМУ</button>
  <button class="menu-item" data-target="12">СПбГУ</button>
  <div class="section-title" style="margin-top:12px;">Зарубежные вузы</div>
  <button class="menu-item" data-target="13">Гарвард</button>
  <button class="menu-item" data-target="14">Стэнфорд</button>
  <button class="menu-item" data-target="15">Оксфорд</button>
  <button class="menu-item" data-target="16">Кембридж</button>
  <button class="menu-item" data-target="17">ETH Zurich</button>
  <button class="menu-item" data-target="18">Сингапур</button>
  <div class="section-title" style="margin-top:12px;">Общие блоки</div>
  <button class="menu-item" data-target="19">Сводная матрица</button>
  <button class="menu-item" data-target="20">Ключевые выводы</button>
  <div class="section-title" style="margin-top:12px;">Айдентика</div>
  <button class="menu-item" data-target="21">Анализ бренда ЦА</button>
  <button class="menu-item" data-target="22">Концепция 1</button>
  <button class="menu-item" data-target="23">Концепция 2</button>
  <button class="menu-item" data-target="24">Концепция 3</button>
</div>

<div class="main">
  <button class="back-btn" id="backBtn">← На главную</button>
  <div class="slide-wrapper" id="slideWrapper"></div>
  <div class="page-number hidden" id="pageNumber">1 / 25</div>
  <div class="footer">Морев Илья · специалист ЦК</div>
</div>

<script src="slides.js"></script>
</body>
</html>
