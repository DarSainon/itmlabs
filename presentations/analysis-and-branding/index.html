const wrapper = document.getElementById('slideWrapper');
const pageNumber = document.getElementById('pageNumber');
const backBtn = document.getElementById('backBtn');
const sidebar = document.getElementById('sidebar');

let current = 0;
const total = slides.length;

function renderSlide(index) {
  const data = slides[index];
  const div = document.createElement('div');
  div.className = 'slide' + (index === current ? ' active' : '');
  div.dataset.index = index;
  if (data.type === 'menu') {
    div.innerHTML = data.content;
    setTimeout(() => {
      div.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const target = parseInt(this.dataset.target);
          if (!isNaN(target)) goTo(target);
        });
      });
    }, 10);
  } else {
    div.innerHTML = `
      <div class="slide-title">${data.title}</div>
      <div class="slide-subtitle">${data.subtitle}</div>
      <div style="flex:1;">${data.content}</div>
    `;
  }
  return div;
}

function buildSlides() {
  wrapper.innerHTML = '';
  slides.forEach((_, i) => {
    wrapper.appendChild(renderSlide(i));
  });
  updateUI();
}

function updateUI() {
  document.querySelectorAll('.slide').forEach((s, i) => {
    s.classList.toggle('active', i === current);
  });
  document.querySelectorAll('.menu-item').forEach((btn) => {
    const target = parseInt(btn.dataset.target);
    btn.classList.toggle('active', target === current);
  });
  if (current === 0) {
    sidebar.classList.add('hidden');
    pageNumber.classList.add('hidden');
    backBtn.classList.remove('visible');
  } else {
    sidebar.classList.remove('hidden');
    pageNumber.classList.remove('hidden');
    backBtn.classList.add('visible');
    pageNumber.textContent = (current) + ' / ' + (total - 1);
  }
}

function goTo(index) {
  if (index < 0) index = 0;
  if (index >= total) index = total - 1;
  current = index;
  buildSlides();
}

backBtn.addEventListener('click', () => goTo(0));

document.querySelectorAll('.menu-item').forEach((btn) => {
  btn.addEventListener('click', function() {
    const target = parseInt(this.dataset.target);
    if (!isNaN(target)) goTo(target);
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (current === 0) return;
    goTo(current + 1);
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (current === 0) return;
    goTo(current - 1);
  }
});

let startX = 0;
document.querySelector('.main').addEventListener('touchstart', (e) => {
  startX = e.touches[0].clientX;
});
document.querySelector('.main').addEventListener('touchend', (e) => {
  if (current === 0) return;
  const diff = startX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 40) {
    if (diff > 0) goTo(current + 1);
    else goTo(current - 1);
  }
});

buildSlides();
</script>
