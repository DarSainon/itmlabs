<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В разработке — ITMLABS</title>
    <!-- Замени favicon на нужный: favicon-1.svg, favicon-2.svg и т.д. -->
    <link rel="icon" type="image/svg+xml" href="../../images/favicon/favicon-0.svg?v=0.2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --teal: #00a69c;
            --teal-dark: #007a72;
            --bg: #f4f3ef;
            --surface: rgba(255,255,255,0.55);
            --text: #12181c;
            --text-muted: #5b6570;
            --text-faint: #98a1a8;
            --line: rgba(18,24,28,0.12);
            --line-soft: rgba(18,24,28,0.07);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Фоновая сетка */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                linear-gradient(var(--line-soft) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none; z-index: 0;
            mask-image: radial-gradient(ellipse at 30% 0%, black 0%, transparent 70%);
        }

        /* Декоративные линии */
        .decor-left, .decor-right {
            position: fixed; top: 0;
            width: 1px; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(0,166,156,0.15), transparent);
            z-index: 0;
        }
        .decor-left { left: 15%; }
        .decor-right { right: 15%; }
        .decor-top, .decor-bottom {
            position: fixed; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(to right, transparent, rgba(0,166,156,0.1), transparent);
            z-index: 0;
        }
        .decor-top { top: 12%; }
        .decor-bottom { bottom: 12%; }

        /* Кнопка назад */
        .home-btn {
            position: fixed; top: 24px; left: 24px; z-index: 10;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0,166,156,0.2);
            border-radius: 50%;
            color: var(--text);
            text-decoration: none;
            transition: all 0.25s;
        }
        .home-btn:hover {
            background: rgba(255,255,255,0.9);
            border-color: var(--teal);
            color: var(--teal);
            transform: scale(1.05);
        }
        .home-btn svg {
            width: 18px; height: 18px;
            stroke: currentColor; stroke-width: 1.5;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }

        /* Центральный блок */
        .wrapper {
            position: relative; z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* Механизм — вращающиеся кольца */
        .mechanism {
            position: relative;
            width: 120px; height: 120px;
        }
        .ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(0,166,156,0.15);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }
        .ring-reverse {
            position: absolute;
            inset: 10px;
            border: 1.5px solid rgba(0,166,156,0.1);
            border-radius: 50%;
            border-left-color: transparent;
            border-bottom-color: transparent;
            animation: spin-reverse 6s linear infinite;
        }
        .gear {
            position: absolute;
            inset: 20px;
            border: 2px dashed rgba(0,166,156,0.2);
            border-radius: 50%;
            animation: spin 12s linear infinite;
        }
        .core {
            position: absolute;
            top: 50%; left: 50%;
            width: 30px; height: 30px;
            background: rgba(0,166,156,0.08);
            border: 1px solid rgba(0,166,156,0.25);
            transform-origin: center center;
            animation: spin-core 4s linear infinite;
        }
        .dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: var(--teal);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,166,156,0.5);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes spin-core {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(90deg); }
        }

        /* Текст */
        .title {
            font-size: 1.6rem; font-weight: 300;
            letter-spacing: 0.12em;
            color: var(--text);
            opacity: 0.8;
        }
        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-faint);
            letter-spacing: 0.08em;
            margin-top: -24px;
        }
    </style>
</head>
<body>
    <div class="decor-left"></div>
    <div class="decor-right"></div>
    <div class="decor-top"></div>
    <div class="decor-bottom"></div>

    <a href="../" class="home-btn" title="В меню">
        <svg viewBox="0 0 24 24">
            <path d="M3 12L12 3l9 9"/>
            <path d="M5 10v10a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1V10"/>
        </svg>
    </a>

    <div class="wrapper">
        <div class="mechanism">
            <div class="ring"></div>
            <div class="ring-reverse"></div>
            <div class="gear"></div>
            <div class="core"></div>
            <div class="dot"></div>
        </div>
        <div class="title">В разработке</div>
        <div class="subtitle">страница скоро появится</div>
    </div>
</body>
</html>
