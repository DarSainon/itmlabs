<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция волн — itmlabs</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .sim-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }
        canvas {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #000;
            cursor: pointer;
        }
        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .controls label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        input[type="range"] {
            width: 160px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: var(--text); }
    </style>
</head>

    <div class="sim-container">
        <h1 style="font-weight:600;font-size:1.8rem;margin-bottom:8px;">🌊 Симуляция волн</h1>
        <p style="color:var(--text-secondary);margin-bottom:20px;">Кликни по полю — создай волну. Ползунок меняет затухание.</p>
